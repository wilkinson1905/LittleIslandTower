<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Island Tower</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f5c9c; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }

  @media (max-aspect-ratio: 9/16) { html, body { background: linear-gradient(#3f8ee0 0 50%, #1567a8 50% 100%); } }
  #stage { position: relative; width: min(100vw, calc(100vh * 9 / 16)); width: min(100vw, calc(100dvh * 9 / 16)); aspect-ratio: 9 / 16; --u: 1px; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
  .px { display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
  #ui { position: absolute; inset: 0; pointer-events: none; color: #5a4632; font: 500 calc(var(--u) * 12)/1.35 "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic UI", "Meiryo", sans-serif; }

  #topbar { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: calc(var(--u) * 8); display: flex; gap: calc(var(--u) * 6); align-items: center; }

  #shopBtn { margin-left: auto; font-size: calc(var(--u) * 12); }

  #floors button { width: calc(var(--u) * 40); height: calc(var(--u) * 30); padding: 0; background: #fff8e7cc; border-radius: calc(var(--u) * 9); font-size: calc(var(--u) * 11); }
  #floors button.sel { background: #3a9fd0; color: #fff; }

  #dock { position: absolute; left: calc(var(--u) * 6); right: calc(var(--u) * 6); bottom: calc(var(--u) * 8); display: flex; gap: calc(var(--u) * 4); align-items: stretch; }
  #growBtn { position: relative; flex: 1 1 auto; min-width: 0; height: calc(var(--u) * 46); padding: 0; border-radius: calc(var(--u) * 12); background: #fff8e7; box-shadow: 0 calc(var(--u) * 3) 0 #d9c49a; overflow: hidden; }
  #growFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #bfe9f2; transition: width .3s; }

  #toast { position: absolute; left: calc(var(--u) * 24); right: calc(var(--u) * 24); top: calc(var(--u) * 46); padding: calc(var(--u) * 8) calc(var(--u) * 12); margin-right: calc(var(--u) * 26); background: #fff8e7f2; border-radius: calc(var(--u) * 12); box-shadow: 0 calc(var(--u) * 2) 0 #d9c49a; text-align: center; opacity: 0; transform: translateY(calc(var(--u) * -6)); transition: opacity .25s, transform .25s; }
  #toast.on { opacity: 1; transform: none; }

  .sheet.on { display: block; }
  .sheet.top { top: calc(var(--u) * 44); bottom: auto; }
  .sheet h3 { margin: 0 0 calc(var(--u) * 6); font-size: calc(var(--u) * 15); }
  .sheet .goods + h3 { margin-top: calc(var(--u) * 12); }
  .sheet ul { margin: 0; padding: 0 0 0 calc(var(--u) * 16); }
  .sheet li { margin: calc(var(--u) * 6) 0; font-size: calc(var(--u) * 12); }
  .sheet .x { position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 6); width: calc(var(--u) * 32); height: calc(var(--u) * 32); padding: 0; background: transparent; font-size: calc(var(--u) * 18); }
  .head { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .head b { font-size: calc(var(--u) * 15); }
  .head .ic { display: flex; width: calc(var(--u) * 44); height: calc(var(--u) * 44); align-items: center; justify-content: center; background: #e2f6fb; border-radius: calc(var(--u) * 10); overflow: hidden; }
  .head .ic .px { max-height: 100%; }
  .hearts { font-size: calc(var(--u) * 13); letter-spacing: .05em; }
  .hearts i { font-style: normal; color: #e6d8bd; }

  .head + .goods { margin-top: calc(var(--u) * 8); }

  .good .gi { flex: none; display: flex; width: calc(var(--u) * 22); justify-content: center; }

  @keyframes rise { to { margin-top: calc(var(--u) * -26); opacity: 0; } }

  #puff { position: absolute; inset: 0; background: #fffef8; opacity: 0; transition: opacity .55s; pointer-events: none; }
  #puff.on { opacity: 1; }

  #unhide { display: none; position: absolute; inset: 0; background: transparent; }

  #panel button { background: #351b1e; color: inherit; border: 1px solid #7a4731; font: inherit; padding: 2px 6px; cursor: pointer; margin: 2px 2px 2px 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="ui" hidden>
    <div id="topbar">
      <div class="pill"><span id="glassIcon"></span><span id="glassN">0</span></div>
      <button class="pill" id="bottleBtn" hidden aria-label="小びんを開ける"><span id="bottleIcon"></span><span id="bottleN"></span></button>
      <button class="pill" id="shopBtn">おみせ</button>
      <button class="pill" id="helpBtn" aria-label="遊び方">？</button>
      <button class="pill" id="menuBtn" aria-label="メニュー">≡</button>
    </div>
    <div id="toast"></div>
    <div id="floors"></div>
    <div id="dock">
      <button id="growBtn"><span id="growFill"></span><span id="growLabel"></span></button>
      <div id="faces"></div>
    </div>
    <div id="card" class="sheet"></div>
    <div id="shop" class="sheet"></div>
    <div id="help" class="sheet"></div>
    <div id="menu" class="sheet"></div>
    <div id="puff"></div>
    <button id="unhide" aria-label="文字を表示する"></button>
  </div>
</div>
<div id="panel"></div>
<script>
(function () {
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   THE SUMMER TOWER: core
   Pixel toolkit, master palette, isometric painter, depth sort, light bake.
   Every pixel on screen is produced by this file's rules, with no images.
   ═══════════════════════════════════════════════════════════════════════ */
/* Set once per house: FORMAT picks the frame, ox and oy place the world's origin in it.
   A portrait house must be designed to fit: it is not a crop of a landscape one. */
const FORMATS = {
  landscape: { w: 640, h: 360, dw: 1920, dh: 1080, ox: 320, oy: 168 },
  portrait: { w: 360, h: 640, dw: 1080, dh: 1920, ox: 180, oy: 405 },
};
const FORMAT = FORMATS.portrait;
const W = FORMAT.w, H = FORMAT.h, N = W * H, OX = FORMAT.ox, OY = FORMAT.oy, DW = FORMAT.dw, DH = FORMAT.dh, LOOP = 120;

const QS = new URLSearchParams(location.search);
const qNum = (k, d) => { const v = parseFloat(QS.get(k)); return Number.isFinite(v) ? v : d; };
const clamp0 = v => Math.max(0, Math.min(3, v | 0));
const CFG = {
  seed: qNum('seed', 1905) | 0,
  loop: QS.get('loop') === '1',
  block: qNum('block', 0) | 0,
  debug: QS.get('debug') === '1',
  speed: qNum('speed', 1),
  freeze: QS.has('t') ? qNum('t', 0) : null,
  zoom: (QS.get('zoom') || '').split(',').map(Number),
  sheet: QS.has('sheet'),
  floors: clamp0(qNum('floors', 0)),
  full: QS.get('full') === '1',
};

/* ── deterministic randomness ─────────────────────────────────────────── */
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hsh(a, b = 0, c = 0) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2147483647);
  h = Math.imul(h ^ h >>> 13, 1274126177);
  h = Math.imul(h ^ h >>> 16, 2246822519);
  return ((h ^ h >>> 15) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* Periodic helpers: `n` must be an integer number of cycles per 120 s,
   which is what makes the loop exact. */
const osc = (t, n, ph = 0) => Math.sin(TAU * (n * t / LOOP + ph));
const cyc = (t, n, ph = 0) => { const v = n * t / LOOP + ph; return v - Math.floor(v); };
function pnoise(t, n, seed) { // smooth periodic value noise with n lattice points
  const v = cyc(t, n) * n, i = Math.floor(v), f = v - i;
  return lerp(hsh(i % n, seed), hsh((i + 1) % n, seed), f * f * (3 - 2 * f));
}

/* ── master palette: hue-shifted ramps, dark to light ─────────────────── */
const RAMPS = {
  ink:  ['#08070f', '#0e0c18', '#17131f', '#1f1a28'],
  mid:  ['#0b0d1f', '#11152e', '#181d3d', '#20274d', '#2b3360', '#394374', '#4c5788', '#64709d'],
  vio:  ['#15102a', '#221738', '#2f2147', '#3f2c58', '#54396b', '#6b4b80', '#876394', '#a480ac'],
  cha:  ['#121216', '#1c1b22', '#28262e', '#36333c', '#47434c', '#5c5760', '#756f76', '#918b8e'],
  amb:  ['#3a1a14', '#5a2a18', '#7d3f1a', '#a2591e', '#c67a28', '#e09c3c', '#f2bf5e', '#fbdf8e'],
  wood: ['#24121a', '#351b1e', '#4a2823', '#60362a', '#7a4731', '#95603d', '#b27d4f', '#cf9f6b'],
  crm:  ['#6a4440', '#8e5f52', '#b28068', '#d0a182', '#e5bf9e', '#f2d7b8', '#f9e8cf', '#fff6e4'],
  rose: ['#33172a', '#4f2236', '#703144', '#934454', '#b15d65', '#ca7f7e', '#dfa39b', '#efc8bb'],
  ter:  ['#2e1418', '#4a1e1c', '#6c2b20', '#8f3c26', '#b0522e', '#c96c3c', '#de8d54', '#edb078'],
  sag:  ['#141f20', '#1e2f2a', '#2c4134', '#3d5540', '#54694c', '#6f825e', '#8f9f76', '#b4bd95'],
  tea:  ['#0e2230', '#15354a', '#1f4c5e', '#2f6672', '#468484', '#66a39a', '#8fc2b0', '#bfdfc8'],
  azu:  ['#2f7fd6', '#3f94e4', '#56a9ec', '#6fbcf2', '#8bcdf6', '#a8dcf8', '#c6e9fa', '#e2f5fc'],
  sea:  ['#0b3a6b', '#0f5590', '#1673b3', '#1f92cf', '#3ab2e0', '#66cfe8', '#9ae4ee', '#cdf4f2'],
  cld:  ['#7fa2c8', '#9fbcd9', '#bdd3e6', '#d6e4f0', '#e8f0f6', '#f4f8fa', '#fbfdfd', '#ffffff'],
  lef:  ['#1c4a3a', '#2a6a46', '#3c8a4e', '#58a858', '#7fc468', '#a6da7e', '#cbe99a', '#e8f6bc'],
  pin:  ['#8a4a6a', '#ad6286', '#cc7fa0', '#e29db6', '#f0bccb', '#f8d4dc', '#fce6ea', '#fff4f5'],
  hon:  ['#6a3c20', '#8a5228', '#ab6c34', '#c98a46', '#dfa75e', '#eec27e', '#f6d9a2', '#fcedc8'],
  min:  ['#2f7a6e', '#45977f', '#62b292', '#84c9a8', '#a6dcbc', '#c4eacf', '#dcf4e0', '#f0fbf0'],
  peb:  ['#4d5f78', '#66788f', '#8293a6', '#9fadbb', '#bbc6ce', '#d3dbde', '#e6ebec', '#f4f6f6'],
  sky:  ['#1a2346', '#24325e', '#314677', '#3f5a8a', '#5e82ad', '#8aaecb', '#b9d3e0', '#e2eef0'],
  gld:  ['#ffcf6e', '#ffe9a8', '#fff4c8', '#fffbe8'],
};
const C = {};                    // C.wood4 is packed RGB
const PAL_RGB = [[0, 0, 0]];     // index 0 means transparent
const hex = h => parseInt(h.slice(1), 16);
const PIDX = new Map();
for (const name in RAMPS) RAMPS[name].forEach((h, i) => {
  const v = hex(h); C[name + i] = v;
  PIDX.set(v, PAL_RGB.length);
  PAL_RGB.push([v >> 16 & 255, v >> 8 & 255, v & 255]);
});
const PAL32 = new Uint32Array(PAL_RGB.length);
PAL_RGB.forEach((p, i) => { PAL32[i] = i === 0 ? 0 : (255 << 24 | p[2] << 16 | p[1] << 8 | p[0]) >>> 0; });

const RAMP_RANGE = [null];
for (const name in RAMPS) { const a = RAMP_RANGE.length; RAMPS[name].forEach(() => RAMP_RANGE.push([a, a + RAMPS[name].length - 1])); }
const SNAP = new Uint8Array(32768);
function nearest(r, g, b) {
  r = r > 255 ? 255 : r | 0; g = g > 255 ? 255 : g | 0; b = b > 255 ? 255 : b | 0;
  const key = (r >> 3) << 10 | (g >> 3) << 5 | b >> 3;
  let v = SNAP[key];
  if (v) return v;
  let best = 1, bd = 1e12;
  for (let i = 1; i < PAL_RGB.length; i++) {
    const p = PAL_RGB[i], dr = p[0] - r, dg = p[1] - g, db = p[2] - b, rm = (p[0] + r) / 2;
    const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
    if (d < bd) { bd = d; best = i; }
  }
  return SNAP[key] = best;
}
const RANGE_OF = new Map();
function rampNearest(c, r, g, b) {
  let rg = RANGE_OF.get(c);
  if (!rg) { rg = RAMP_RANGE[nearest(c >> 16 & 255, c >> 8 & 255, c & 255)]; RANGE_OF.set(c, rg); }
  let best = rg[0], bd = 1e12;
  for (let i = rg[0]; i <= rg[1]; i++) {
    const p = PAL_RGB[i], dr = p[0] - r, dg = p[1] - g, db = p[2] - b, d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
const pidx = rgb => nearest(rgb >> 16 & 255, rgb >> 8 & 255, rgb & 255);
const pal = name => PIDX.get(C[name]);
const lite = (c, f) => {
  const r = Math.min(255, (c >> 16 & 255) * f), g = Math.min(255, (c >> 8 & 255) * f), b = Math.min(255, (c & 255) * f);
  return r << 16 | g << 8 | b;
};
const mix = (a, b, t) => {
  const f = (s) => ((a >> s & 255) + ((b >> s & 255) - (a >> s & 255)) * t) | 0;
  return f(16) << 16 | f(8) << 8 | f(0);
};

const mapCache = new Map();
function pmap(str) { // "a:wood4 b:rose3"
  let m = mapCache.get(str);
  if (m) return m;
  m = {};
  for (const part of str.split(' ')) if (part) m[part[0]] = C[part.slice(2)];
  mapCache.set(str, m);
  return m;
}

/* ── projection ───────────────────────────────────────────────────────── */
const isoX = (x, y) => OX + x - y;
const isoY = (x, y, z) => OY + ((x + y) >> 1) - z;

/* ── painter: writes into a per-object scratch, later merged in depth order ─ */
const tCol = new Int32Array(N), tX = new Int16Array(N), tY = new Int16Array(N), tZ = new Int16Array(N);
const tN = new Uint8Array(N), tStamp = new Uint16Array(N), touched = new Int32Array(N);
let tCount = 0, tCur = 0, paintSerial = 0;
const NTOP = 0, NY = 1, NX = 2, NBILL = 3, NEMIT = 4;

function put(sx, sy, rgb, wx, wy, wz, n) {
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  const i = sy * W + sx;
  if (tStamp[i] !== tCur) { tStamp[i] = tCur; touched[tCount++] = i; }
  tCol[i] = rgb; tX[i] = wx; tY[i] = wy; tZ[i] = wz; tN[i] = n;
}
const val = (c, a, b) => typeof c === 'function' ? c(a, b) : c;

/* Top plane at height z: (i,j) local cells; the world-to-screen map is one-to-one. */
function top(x, y, z, w, d, c, n = NTOP) {
  for (let j = 0; j < d; j++) for (let i = 0; i < w; i++) {
    const v = val(c, i, j);
    if (v == null || v < 0) continue;
    const X = x + i, Y = y + j;
    put(OX + X - Y, OY + ((X + Y) >> 1) - z, v, X, Y, z, n);
  }
}
/* +y-facing plane at y=Y: i runs screen-right, k runs up. */
function fy(x, Y, z, w, h, c, n = NY) {
  for (let i = 0; i < w; i++) for (let k = 0; k < h; k++) {
    const v = val(c, i, k);
    if (v == null || v < 0) continue;
    const X = x + i;
    put(OX + X - Y, OY + ((X + Y) >> 1) - z - k, v, X, Y, z + k, n);
  }
}
/* +x-facing plane at x=X: j runs screen-left (increasing y), k runs up. */
function fx(X, y, z, d, h, c, n = NX) {
  for (let j = 0; j < d; j++) for (let k = 0; k < h; k++) {
    const v = val(c, j, k);
    if (v == null || v < 0) continue;
    const Y = y + j;
    put(OX + X - Y, OY + ((X + Y) >> 1) - z - k, v, X, Y, z + k, n);
  }
}
/* Solid iso box with lit edges. */

O('tent', [72, 44, Z1, 93, 65, Z1 + 26], () => {
  const x = 72, w = 20, h = 22, y1 = 64, y0 = 44, cx = 9.5;
  const half = k => (h - k) * (w / 2) / h;
  for (let yy = y0; yy <= y1; yy += .5) for (let k = 0; k <= h; k += .5) {
    const X = x + w - k * (w / 2) / h, band = Math.floor(yy / 5) % 2;
    const col = k < 1 ? C.hon1 : k > h - 1 ? C.crm7 : band ? C.crm5 : C.sea3;
    put(Math.round(OX + X - yy), Math.round(OY + (X + yy) / 2 - Z1 - k), col, X | 0, yy | 0, Z1 + (k | 0), NX);
  }
  fy(x, y1, Z1, w, h + 1, (i, k) => {
    const d = Math.abs(i - cx);
    if (d > half(k)) return -1;
    if (d > half(k) - 1.5) return C.crm7;
    if (d < (13 - k) * .46 && k < 13) return k < 1 ? C.hon1 : C.mid2;
    return Math.floor((i + 40) / 4) % 2 ? C.sea5 : C.crm7;
  });
  spr(x + 10, y1, Z1 + h, 'p:pin3 q:pin5 s:hon2', ['pq...', 'ppq..', 'pq...', 's....', 's....']);
}, { level: 1, furn: 'tent' });

const Z2 = FLOOR_Z[1];
const paperLemon = (u, v) => {
  const row = Math.floor(v / 12), q = ((u + (row % 2) * 6) % 12 + 12) % 12, w = ((v % 12) + 12) % 12;
  if (q >= 4 && q <= 6 && w >= 4 && w <= 6 && !(q === 4 && w === 6)) return C.amb7;
  if (q === 7 && w === 7) return C.lef5;
  return u % 12 === 0 ? C.crm6 : C.crm7;
};
const wall2 = (u, k) => {
  if (k < 24) { // splash tiles
    if (k === 23) return C.crm7;
    if (k % 6 === 0 || u % 6 === 0) return C.sea6;
    return ((u >> 3) ^ (k >> 3)) & 1 ? C.cld6 : C.cld4;
  }
  return paperLemon(u, k);
};
const floor2 = (i, j) => {
  if (i % 12 === 11 || j % 12 === 11) return C.crm3;
  return ((i / 12) | 0) + ((j / 12) | 0) & 1 ? C.sea6 : C.crm6;
};

}, { level: 2, layer: L_BACK(2), outline: .85, furn: 'counter' });

   parasol waiting for someone, and a jetty. Things that can stand in front of

   ═══════════════════════════════════════════════════════════════════════ */
const shoreAt = (X, Y) => shoreF(OX + X - Y, OY + ((X + Y) >> 1));
const isLand = (X, Y) => shoreAt(X, Y) < 1;
const GRASS_F = (X, Y) => (hexAt(X, Y) - 1) * 30 + (hsh(X >> 3, Y >> 3, 17) - .5) * 14;
O('island', [-70, -70, -2, 240, 240, 0], () => {
  top(-70, -70, 0, 310, 310, (i, j) => {
    const X = i - 70, Y = j - 70, f = shoreAt(X, Y);
    if (f >= 1) return -1;
    if (f > .93) return hsh(X >> 1, Y >> 1, 3) < .12 ? C.hon5 : C.hon6;
    if (GRASS_F(X, Y) < 12) {

   Behaviour. A block is 120 s long and every animal starts and ends it in its
   own home pose, so any block can follow any other. Animals leave their floors
   by the long ladder or the open front of the tower. A timeline depends on the
   storeys, the furniture and who else is here, all read once when the block is
   compiled, so two animals can meet at an agreed moment or carry on alone.
   ═══════════════════════════════════════════════════════════════════════ */

class Track {
  constructor(home) { this.t = 0; this.segs = []; this.p = home; }
  pose(dur, anim, o) {
    this.segs.push({ t0: this.t, t1: this.t + dur, kind: 0, anim, a: this.p, b: this.p, o });
    this.t += dur;
    return this;
  }
  until(T, anim, o) { if (T > this.t) this.pose(T - this.t, anim, o); return this; }
  walk(nodes, speed, anim) {
    for (const n of nodes) {
      const a = this.p, d = Math.hypot(n.x - a.x, n.y - a.y, n.z - a.z) || 1;
      this.segs.push({ t0: this.t, t1: this.t + d / speed, kind: 1, anim, a, b: n });
      this.t += d / speed;
      this.p = n;
    }
    return this;
  }
  hop(n, dur, anim) {
    this.segs.push({ t0: this.t, t1: this.t + dur, kind: 2, anim, a: this.p, b: n });
    this.t += dur;
    this.p = n;
    return this;
  }
}

    T.walk([at2(74, 42), at2(50, 42)], PUPV, 'walk').pose(4, 'sniff').pose(3, 'sitWag');

    T.walk([TO_FOOT, PUP_SAND], PUPR, 'walk');
    pupCaught(T, r, ctx, RAIN_SHOW);
  },
  /* the cat is always here too: from the door of the loop, one length behind it */
  play(T, r) {
    T.pose(2 + r() * 2, 'curl').pose(1.2, 'stand'); pupDown(T);
    T.walk([TO_FOOT, atB(96, 118), LAP[3]], PUPR, 'walk').until(20, 'sitWag');
    for (let n = 0; n < 3; n++) T.walk(lapFrom(3, 1), CHASEV, 'walk');
    T.pose(2, 'bark');
    for (let n = 0; n < 2; n++) T.walk(lapFrom(3, -1), CHASEV, 'walk');
    T.pose(3, 'bark').pose(6, 'sitWag').walk([atB(96, 118), TO_FOOT], PUPR, 'walk'); pupUp(T);
  },
  /* down to the cat's bed, for a nap against it */
  nap(T, r) {
    T.pose(4 + r() * 4, 'curl').pose(1.2, 'stand'); pupToLadder(T);
    T.hop(lad(Z2), .4, 'land').walk([lad(Z1)], CLIMB, 'climb').hop(entry(Z1), .4, 'land').walk([at1(54, 95), at1(55, 90)], PUPR, 'walk');
    T.until(84, 'curl').pose(1.2, 'stand').walk([at1(54, 95), entry(Z1)], PUPR, 'walk');
    T.hop(lad(Z1), .4, 'land').walk([lad(Z2)], CLIMB, 'climb').hop(entry(Z2), .4, 'land'); pupFromLadder(T);
  },
  /* the cat comes up to say hello */
  visited(T) {
    T.until(38, 'curl').pose(1.2, 'stand').until(40, 'stand').pose(5, 'nose', { flip: true }).pose(4, 'sitWag');
    T.walk([at2(74, 42), at2(50, 42)], PUPV, 'walk').pose(3, 'sniff').pose(8, 'sitWag');
    T.walk([at2(74, 42), at2(74, 70)], PUPV, 'walk').pose(.8, 'stand');
  },
  beg(T, r) {
    T.pose(16 + r() * 8, 'curl').pose(1.2, 'stand');
    T.walk([at2(74, 42), at2(50, 42)], PUPV, 'walk').pose(3, 'sniff').pose(12, 'sitWag').pose(3, 'g2').pose(6, 'sitWag');
    T.walk([at2(74, 42), at2(74, 70)], PUPV, 'walk').pose(.8, 'stand');
  },
  bowls(T, r) {
    T.pose(8 + r() * 8, 'curl').pose(1.2, 'stand');
    T.walk([at2(74, 58), at2(84, 58)], PUPV, 'walk').pose(own('bowls') ? 8 : 3, 'sniff').pose(8, 'sitWag');
    T.walk([at2(74, 58), at2(74, 70)], PUPV, 'walk').pose(.8, 'stand');
  },
  rest(T, r) {
    if (present('sheep')) T.until(30, 'curl').pose(4, 'curl', { hearts: 1 }).until(80, 'curl');   // the sheep comes to sleep beside it
    else T.pose(44 + r() * 20, 'curl');
    T.pose(1.2, 'stand').pose(2.4, 'stretch').pose(.6, 'stand').pose(10, 'sitWag');
  },
  /* the cat comes for it, and off they go to the crab */
  crab(T) {
    T.until(10.5, 'curl').pose(1.5, 'stand').pose(3, 'nose', { flip: true });
    pupToLadder(T); ladderDown(T, Z2);
    T.walk([TO_FOOT, atB(112, 140)], PUPR, 'walk').until(32, 'sitWag').until(40, 'tease').pose(1.5, 'stand');
    T.walk([atB(128, 118)], PUPR, 'walk').until(52, 'sitWag').until(60, 'tease').pose(1.5, 'stand').pose(3, 'sitWag');
    T.walk([TO_FOOT], PUPR, 'walk'); pupUp(T);
  },
  boat(T, r) {
    T.pose(6 + r() * 6, 'curl').pose(1.2, 'stand'); pupDown(T);
    pupToJetty(T);
    T.until(36, 'gaze').pose(16 + r() * 8, 'gaze').pose(5, 'sitWag');
    pupFromJetty(T);
  },
  rainbow(T, r, ctx) {
    T.pose(2 + r() * 3, 'curl').pose(1.2, 'stand'); pupDown(T);
    T.walk([TO_FOOT, PUP_SAND], PUPR, 'walk').pose(3, 'sniff');
    pupCaught(T, r, ctx, RAIN_DAY);
  },
  /* the cat is up the palm; it would like to climb as well, and can't */
  palm(T, r) {
    T.pose(8 + r() * 6, 'curl').pose(1.2, 'stand'); pupDown(T);
    T.walk([TO_FOOT, atB(46, 146)], PUPR, 'walk').pose(3, 'sniff').pose(7, 'bark').pose(4, 'sitWag');
    T.walk([atB(60, 138), atB(46, 146)], PUPR, 'walk').pose(6, 'bark').pose(3, 'sitWag');
    T.walk([TO_FOOT], PUPR, 'walk'); pupUp(T);
  },
  /* meets the cat on the sand */
  beach(T, r) {
    T.pose(3 + r() * 4, 'curl').pose(1.2, 'stand'); pupDown(T);
    T.walk([TO_FOOT, atB(92, 100), NOSE_PUP], PUPR, 'walk').until(26, 'sitWag').pose(5, 'nose', { flip: true }).pose(2, 'g4');
    T.walk([atB(122, 106)], PUPR, 'walk').pose(4, 'sniff').pose(3, 'sitWag');
    T.walk([atB(100, 150)], PUPR, 'walk').pose(10 + r() * 6, 'sitWag').walk([atB(58, 120)], PUPR, 'walk').pose(5, 'sniff');
    pupUp(T);
  },
  roof(T, r) {
    T.pose(14 + r() * 8, 'curl').pose(1.2, 'stand'); pupToLadder(T);
    toRoof(T, Z2, rf(12, 18, 27), PUPV, 'walk');
    T.until(42, 'sitWag').pose(3, 'gaze', { hearts: 1 }).pose(11, 'gaze').pose(4, 'sitWag');
    fromRoof(T, Z2, PUPV, 'walk'); pupFromLadder(T);
  },
};

/* ── the rabbit: basket, rug, the big bed, and the sky just above ─────── */
const RABV = 13, RABR = RABV + 4, rabDoor = at3(75, 78);
const rabOff = T => T.hop(rabDoor, .45, 'hop');
const rabOn = T => T.hop(HOME.rabbit, .45, 'hop');
const rabToBed = T => T.walk([at3(75, 62), at3(58, 62)], RABV, 'hop').hop(at3(44, 62, 10), .55, 'hop');
const rabFromBed = T => T.hop(at3(58, 62), .5, 'hop').walk([at3(75, 62), rabDoor], RABV, 'hop');
const rabToLadder = T => { rabOff(T); T.walk([at3(60, 80), at3(42, 90), entry(Z3)], RABR, 'hop'); };
const rabFromLadder = T => { T.walk([at3(42, 90), at3(60, 80), rabDoor], RABR, 'hop'); rabOn(T); };
const RAB_SEAT = () => rf(-26, 18, 24);
const RAB_WIN = at3(27, 76), RAB_FLOWER = atB(126, 60), RABG = RABV + 7;
const rabToFlowers = T => { rabToLadder(T); ladderDown(T, Z3); T.walk([TO_FOOT, atB(108, 108), RAB_FLOWER], RABG, 'hop'); };
function rabCaught(T, r, day) {
  const { start: S, end: E, leave } = day, stays = r() < WET.pet, out = r() < .5, way = [atB(108, 108), TO_FOOT, FOOT];
  T.until(S + 1, 'nibble');
  if (stays) {  // stays among the flowers, then finds a clear view of the sky
    T.until(E - 1, 'nibble').walk([RAB_EAST], RABV, 'hop').until(Math.min(leave, 100), 'gaze');
    T.walk(way, RABG, 'hop'); ladderUp(T, Z3); rabFromLadder(T);
    return;
  }
  T.walk(way, RABG + 6, 'hop'); ladderUp(T, Z3);
  T.walk([RAB_WIN], RABV, 'hop').until(E - 1, 'gaze');
  if (out) {
    T.walk([entry(Z3)], RABV, 'hop'); toRoof(T, Z3, RAB_SEAT(), RABR, 'hop');
    T.until(leave, 'gaze').pose(1, 'sit'); fromRoof(T, Z3, RABR, 'hop');
  } else T.until(leave, 'gaze').walk([entry(Z3)], RABV, 'hop');
  rabFromLadder(T);
}
const RAB = {
  show(T, r) {
    T.pose(5, 'loaf').pose(1.4, 'sit'); rabToFlowers(T);
    rabCaught(T, r, RAIN_SHOW);
  },
  /* down the ladder to sleep against the cat */
  nap(T, r) {
    T.pose(3 + r() * 3, 'loaf').pose(1.4, 'sit'); rabToLadder(T);
    T.hop(lad(Z3), .4, 'land').walk([lad(Z1)], CLIMB, 'climb').hop(entry(Z1), .4, 'land').walk([at1(54, 95), at1(56, 92)], RABR, 'hop');
    T.until(84, 'loaf').pose(1.4, 'sit').walk([at1(54, 95), entry(Z1)], RABR, 'hop');
    T.hop(lad(Z1), .4, 'land').walk([lad(Z3)], CLIMB, 'climb').hop(entry(Z3), .4, 'land'); rabFromLadder(T);
  },
  bed(T, r) {
    T.pose(12 + r() * 10, 'loaf').pose(1.4, 'sit'); rabOff(T);
    if (own('bed3')) { rabToBed(T); T.pose(2, 'sit').pose(40 + r() * 10, 'loaf').pose(5, 'g4').pose(1, 'sit'); rabFromBed(T); }
    else T.walk([at3(75, 62)], RABV, 'hop').pose(8, 'look').pose(5, 'g4').walk([rabDoor], RABV, 'hop');
    rabOn(T);
  },
  rug(T, r) {
    T.pose(6 + r() * 10, 'loaf').pose(1.4, 'sit'); rabOff(T);
    T.walk([at3(75, 62)], RABV, 'hop');
    for (let n = 0; n < 3; n++) T.pose(5, 'sit').pose(4, 'g2').pose(3, 'g4');
    T.walk([rabDoor], RABV, 'hop'); rabOn(T);
  },
  rest(T, r) { T.pose(36 + r() * 20, 'loaf').pose(2, 'sit').pose(5, 'g4').pose(2, 'sit'); },
  roof(T, r) {
    T.pose(6 + r() * 6, 'loaf').pose(1.4, 'sit'); rabToLadder(T); toRoof(T, Z3, RAB_SEAT(), RABR, 'hop');
    T.pose(34 + r() * 8, 'gaze').pose(4, 'g4').pose(1, 'sit');
    fromRoof(T, Z3, RABR, 'hop'); rabFromLadder(T);
  },
  rainbow(T, r) {
    T.pose(2 + r() * 2, 'loaf').pose(1.4, 'sit'); rabToFlowers(T);
    rabCaught(T, r, RAIN_DAY);
  },
  /* all the way down, to nibble among the sunflowers */
  flowers(T, r) {
    T.pose(4 + r() * 6, 'loaf').pose(1.4, 'sit'); rabToLadder(T); ladderDown(T, Z3);
    const v = RABV + 7;
    T.walk([TO_FOOT, atB(108, 108), atB(126, 60)], v, 'hop').pose(2, 'sit').pose(7, 'nibble').pose(3, 'look');
    T.walk([atB(124, 40)], v, 'hop').pose(6, 'nibble').pose(3, 'sit');
    T.walk([atB(108, 108), TO_FOOT, FOOT], v, 'hop'); ladderUp(T, Z3); rabFromLadder(T);
  },
};

/* ── the cloud sheep: drifts about, in no hurry, and sometimes with the clouds ─ */
const SHV = 7, SHR = SHV + 5;
const shOut = T => T.walk([at1(68, 75, 18), at1(84, 100, 24), atB(104, 118, 44)], SHR, 'drift');
const shIn = T => T.walk([at1(84, 100, 24), at1(68, 75, 18), at1(40, 60, 16)], SHR, 'drift');
const SH_WIN = at1(26, 68, 20), SH_FLOWER = atB(124, 58, 40);
function sheepCaught(T, r, day) {
  const { start: S, end: E, leave } = day, stays = r() < WET.pet, out = r() < .5;
  T.until(S + 1, 'rainy');
  if (stays) T.until(E - 1, 'rainy').walk([SH_BOW], SHR, 'drift');
  else {
    T.walk([atB(104, 118, 44), at1(84, 100, 24), at1(68, 75, 18), SH_WIN], SHR + 6, 'drift').until(E - 1, 'gaze');
    if (!out) { T.until(leave, 'gaze').walk([HOME.sheep], SHV, 'drift'); return; }
    shOut(T); T.walk([SH_BOW], SHR, 'drift');
  }
  T.until(leave, 'arc').pose(1, 'float').walk([atB(104, 118, 44)], SHR, 'drift'); shIn(T);
}
const SHEEP = {
  show(T, r) { T.pose(4 + r() * 6, 'float'); shOut(T); T.walk([SH_FLOWER], SHR, 'drift'); sheepCaught(T, r, RAIN_SHOW); },
  drift(T, r) {
    T.pose(5 + r() * 8, 'float');
    for (let n = 0; n < 2; n++) T.walk([at1(68, 60, 18 + r() * 8), at1(68, 75, 16), at1(40, 75, 18 + r() * 8), at1(40, 60, 16)], SHV, 'drift').pose(2 + r() * 3, 'float');
  },
  rain(T, r) { T.pose(10 + r() * 10, 'float').pose(9, 'g2').pose(16, 'snooze').pose(2, 'float'); },
  rest(T, r) {
    if (present('pup')) {   // up to the puppy's floor, for a sleep beside it
      T.pose(6 + r() * 2, 'float'); shOut(T);
      T.walk([atB(100, 100, 118), at2(86, 68, 10)], SHR, 'drift').until(80, 'snooze').pose(1, 'float');
      T.walk([atB(100, 100, 118), atB(104, 118, 44)], SHR, 'drift'); shIn(T);
      return;
    }
    T.pose(14 + r() * 10, 'float').pose(30 + r() * 20, 'snooze').pose(2, 'float');
  },
  /* puts out the dragon's flame */
  douse(T, r) {
    T.pose(4 + r() * 4, 'float'); shOut(T);
    T.walk([atB(146, 110, 30)], SHR, 'drift').until(44, 'float').pose(6, 'rainy').pose(5, 'happy').pose(1, 'float');
    T.walk([atB(104, 118, 44)], SHR, 'drift'); shIn(T);
  },
  /* waters the sunflowers */
  sunny(T, r) {
    T.pose(6 + r() * 6, 'float'); shOut(T);
    T.walk([atB(124, 58, 40)], SHR, 'drift').pose(12, 'rainy').pose(6, 'float').walk([atB(132, 42, 40)], SHV, 'drift').pose(8, 'rainy');
    T.walk([atB(104, 118, 44)], SHR, 'drift'); shIn(T);
  },
  /* goes up to be a cloud for a while */
  sky(T, r) {
    T.pose(4 + r() * 6, 'float'); shOut(T);
    T.walk([atB(118, 140, Math.min(300, roofBase() + 30))], SHR, 'drift').pose(14 + r() * 6, 'snooze').pose(4, 'float');
    T.walk([atB(104, 118, 44)], SHR, 'drift'); shIn(T);
  },
  /* over the flowers when it starts; maybe a small rainbow of its own under the big one */
  arc(T, r) {
    T.pose(4 + r() * 4, 'float'); shOut(T); T.walk([SH_FLOWER], SHR, 'drift');
    sheepCaught(T, r, RAIN_DAY);
  },
};

/* ── the little dragon: minds the oven; flies badly, and often ────────── */
const DRV = 14, DRR = DRV + 7, ovenFront = at2(34, 51, 9), DR_GATE = atB(98, 112, 90);
const dragonToOven = T => T.walk([at2(32, 58, 16), ovenFront], DRV, 'fly');
const dragonHome = T => T.walk([at2(32, 58, 16), HOME.dragon], DRV, 'fly');
const drOut = T => T.walk([at2(60, 84, 18), DR_GATE], DRR, 'fly');
const drIn = T => T.walk([DR_GATE, at2(60, 84, 18), HOME.dragon], DRR, 'fly');
const atCrown = p => { const c = trunk(p, 1); return { x: c.x, y: c.y, z: c.z + 2 }; };
const DR_WIN = at2(24, 68, 20);
/* it likes the rain: out it goes, nearly always, and dances in it */
function dragonRain(T, r, day) {
  const { start: S, end: E, leave } = day, out = r() < WET.dragon, after = r() < .5;
  T.until(S, 'perch');
  if (out) {
    drOut(T); T.walk([atB(140, 120, 44)], DRR, 'fly');
    T.pose(5, 'rainy').walk([atB(160, 104, 54), atB(150, 136, 40)], DRV, 'fly').pose(5, 'rainy').walk([atB(140, 120, 44)], DRV, 'fly').until(E - 1, 'rainy');
  } else {
    T.walk([DR_WIN], DRV, 'fly').until(E - 1, 'gaze');
    if (!after) { T.until(leave, 'gaze').walk([HOME.dragon], DRV, 'fly'); return; }
    drOut(T);
  }
  T.walk([DR_BOW], DRR, 'fly').until(leave, 'gaze').pose(1, 'hover');
  T.walk([DR_GATE], DRR, 'fly'); drIn(T);
}
const DRAGON = {
  show(T, r) { dragonRain(T, r, RAIN_SHOW); },
  /* a small flame on the sand, until the sheep comes over */
  fire(T, r) {
    T.pose(14 + r() * 4, 'perch'); drOut(T);
    T.walk([atB(160, 110, 14)], DRR, 'fly').until(40, 'hover').pose(10, 'blow').pose(5, 'happy', { hearts: 1 }).pose(1, 'hover');
    T.walk([DR_GATE], DRR, 'fly'); drIn(T);
  },
  oven(T, r) {
    T.pose(12 + r() * 12, 'perch');
    if (own('oven')) { dragonToOven(T); T.pose(5, 'light').pose(3, 'hover'); dragonHome(T); }
    T.pose(5, 'perch').pose(5, 'g2').pose(14, 'sleep').pose(2, 'perch');
  },
  loop(T, r) {
    T.pose(8 + r() * 12, 'perch').walk([at2(32, 66, 24), at2(34, 84, 18)], DRV, 'fly').pose(5, 'g4');
    T.walk([at2(74, 84, 18), at2(74, 42, 18), at2(34, 42, 18)], DRV, 'fly').pose(5, 'g2').walk([at2(32, 58, 18), HOME.dragon], DRV, 'fly').pose(2, 'perch');
  },
  rest(T, r) { T.pose(10 + r() * 8, 'perch').pose(44 + r() * 20, 'sleep').pose(2, 'perch'); },
  crab(T, r) {
    T.pose(36 + r() * 10, 'perch'); drOut(T);
    T.walk([atB(150, 130, 70), atB(120, 136, 18)], DRR, 'fly').until(92, 'hover').until(100, 'tease').pose(1, 'hover');
    T.walk([DR_GATE], DRR, 'fly'); drIn(T);
  },
  /* sits in the crown of the tall palm */
  palm(T, r) {
    T.pose(10 + r() * 10, 'perch'); drOut(T);
    T.walk([atCrown(PALMS[0])], DRR, 'fly').pose(30 + r() * 8, 'perch').pose(5, 'g2').pose(1, 'hover');
    T.walk([DR_GATE], DRR, 'fly'); drIn(T);
  },
  roof(T, r) {
    T.pose(8 + r() * 10, 'perch'); drOut(T);
    T.walk([atB(100, 110, roofBase() + 30), rf(6, 10, 37)], DRR, 'fly').pose(30 + r() * 8, 'perch').pose(8, 'sleep').pose(3, 'perch');
    T.walk([atB(100, 110, roofBase() + 30), DR_GATE], DRR, 'fly'); drIn(T);
  },
  boat(T, r) {
    T.pose(8 + r() * 8, 'perch'); drOut(T);
    T.walk([atB(190, 104, 34)], DRR, 'fly').pose(32 + r() * 8, 'gaze').pose(5, 'g4');
    T.walk([DR_GATE], DRR, 'fly'); drIn(T);
  },
  rainbow(T, r) { dragonRain(T, r, RAIN_DAY); },
};

/* ── the penguin: paces the jetty, then the sand, with great seriousness ─ */
const PGV = 7, deckEnd = atB(154, 119, 5), sand = atB(146, 119, 0);
const pgOff = T => T.walk([deckEnd], PGV + 2, 'waddle').hop(sand, .5, 'flap');
const pgOn = T => T.hop(deckEnd, .55, 'flap').walk([HOME.penguin], PGV + 2, 'waddle');
/* no room to run to: it waits under the parasol, then walks round for a clear view */
function penguinRain(T, day) {
  const { start: S, end: E, leave } = day, gap = atB(60, 128);
  T.until(S, 'stand'); pgOff(T);
  T.walk([PG_SHADE], PGV + 6, 'waddle').until(E - 1, 'stand').pose(2, 'flap');
  T.walk([gap, PG_BOW], PGV + 2, 'waddle').until(leave, 'gaze').pose(2, 'flap');
  T.walk([gap, sand], PGV + 3, 'waddle'); pgOn(T);
}
const PENGUIN = {
  show(T) { penguinRain(T, RAIN_SHOW); },
  beach(T, r) {
    T.pose(10 + r() * 10, 'stand'); pgOff(T);
    T.walk([atB(146, 100), atB(132, 100)], PGV, 'waddle').pose(10 + r() * 10, 'stand').pose(4, 'flap');
    T.walk([atB(146, 100), sand], PGV, 'waddle'); pgOn(T);
  },
  slide(T) {
    T.pose(6, 'stand').pose(3, 'flap'); pgOff(T);
    T.walk([atB(146, 92), atB(130, 92)], PGV, 'waddle').pose(5, 'g4').pose(3, 'stand');
    T.walk([atB(146, 92)], PGV, 'waddle').pose(1, 'flap').pose(3.5, 'g2', { to: sand });
    T.p = sand; T.pose(3, 'stand'); pgOn(T);
  },
  rest(T, r) { T.pose(24 + r() * 16, 'stand').pose(30 + r() * 10, 'nap').pose(3, 'flap'); },
  crab(T, r) {
    T.pose(36 + r() * 8, 'stand'); pgOff(T);
    T.walk([atB(120, 135), CRAB_L], PGV + 2, 'waddle').until(72, 'stand').until(80, 'tease').pose(1.5, 'flap');
    T.walk([atB(120, 135), sand], PGV + 2, 'waddle'); pgOn(T);
  },
  jetty(T, r) {
    T.pose(8 + r() * 8, 'stand').walk([atB(172, 124, 5)], PGV, 'waddle');
    T.pose(34 + r() * 8, 'gaze').pose(3, 'flap').pose(4, 'g4').walk([HOME.penguin], PGV, 'waddle');
  },
  pool(T, r) {
    T.pose(6 + r() * 6, 'stand'); pgOff(T);
    T.walk([atB(110, 122), atB(56, 124)], PGV + 3, 'waddle').pose(6, 'peck').pose(8, 'stand').pose(6, 'peck').pose(2, 'flap');
    T.walk([atB(110, 122), sand], PGV + 3, 'waddle'); pgOn(T);
  },
  rainbow(T) { penguinRain(T, RAIN_DAY); },
};

const SCRIPTS = {
  /* everyone's best moment in one loop */
  showcase: { cat: CAT.show, pup: PUP.show, rabbit: RAB.show, sheep: SHEEP.show, dragon: DRAGON.show, penguin: PENGUIN.show, shower: [RAIN_SHOW.start, RAIN_SHOW.end] },
  /* everyone has a go at the crab, one at a time */
  crab: { cat: CAT.crab, pup: PUP.crab, rabbit: RAB.rug, sheep: SHEEP.sunny, dragon: DRAGON.crab, penguin: PENGUIN.crab },
  /* a sail on the horizon: the jetty fills up */
  boat: { cat: CAT.boat, pup: PUP.boat, rabbit: RAB.roof, sheep: SHEEP.drift, dragon: DRAGON.boat, penguin: PENGUIN.jetty },

    box.appendChild(b);
    m.append(h, box);
  }
  const left = furnitureLeft();
  for (let n = 1; n <= GS.storeys; n++) {
    const keys = left.filter(k => FURNITURE[k].floor === n);
    if (!keys.length) continue;
    const h = document.createElement('h3'); h.textContent = n + '階';
    const box = document.createElement('div'); box.className = 'goods';
    for (const key of keys) {
      const f = FURNITURE[key], b = document.createElement('button');
      picture(b, artCanvas(furnitureArt(key)), f.name, f.price);
      b.dataset.furn = key;
      b.onclick = () => placeFurniture(key);
      box.appendChild(b);
    }
    m.append(h, box);
  }
}
function placeFurniture(key) {
  if (!furnish(key)) return;
  const f = FURNITURE[key], sx = iX(f.at[0], f.at[1]), sy = iY(f.at[0], f.at[1], f.at[2]);
  closeSheets();
  setView(f.floor);
  startHighlight(key);
  for (let i = 0; i < 7; i++) spark(sx + hsh(i, 173) * 24 - 12, sy + hsh(i, 174) * 18 - 9, 'amb7', 11, .9);
  // whoever lives on this floor comes over to see
  for (const id of ACTOR_IDS) if (present(id) && inOwnRoom(ACTOR[id]) && FLOOR_OF[id] === FLOOR_Z[f.floor - 1]) petAnimal(id);
  saveGame(); refreshUI();
}
const HELP = [
  '波打ち際に光るシーグラスをタップして集めます。閉じている間も、小びんに少したまります。',
  '集めたシーグラスで塔を建て増しします。階が増えると動物がやってきます。',
  '「おみせ」で家具を買うと、部屋に置かれます。動物たちも使います。小びんを大きくすると、閉じている間にたくさんたまります。',
  'プレゼント付きの風船が流れてきたら、タップしましょう。浜に落ちたプレゼントを開くと、シーグラスがたくさん出てきます。',
  '動物をタップすると、おやつやおもちゃをあげられます。なつくと新しいしぐさを見せてくれます。',
  '動物たちは、はしごで屋根や浜辺にも出かけます。',
  '3階まで建ったら、窓辺におやつを置きましょう。次に開いたとき、新しい動物が来ているかもしれません。',
  '進み具合はこのブラウザの中に自動で保存されます。',
];
function renderHelp() {
  const m = UI.help;
  m.classList.toggle('on', helpOpen);
  if (!helpOpen) return;
  m.innerHTML = `<button class="x" aria-label="とじる">×</button><h3>遊び方</h3><ul>${HELP.map(s => `<li>${s}</li>`).join('')}</ul>`;
  m.querySelector('.x').onclick = closeSheets;
}
function renderMenu() {
  const m = UI.menu;
  m.classList.toggle('on', menuOpen);
  if (!menuOpen) return;
  m.innerHTML = `<button class="x" aria-label="とじる">×</button><h3>Little Island Tower</h3>
    <button id="hideBtn" class="wide">文字を隠して眺める</button>
    <button id="resetBtn" class="wide danger">最初からやり直す</button>`;
  m.querySelector('.x').onclick = () => { menuOpen = false; renderMenu(); };
  m.querySelector('#hideBtn').onclick = () => { menuOpen = false; renderMenu(); UI.ui.classList.add('hide'); };
  const r = m.querySelector('#resetBtn');
  r.onclick = () => {
    if (r.dataset.armed) { resetGame(); return; }
    r.dataset.armed = '1'; r.textContent = '本当にやり直す（もう一度押す）';
  };
}
function refreshUI() {
  if (!UI.ui) return;
  UI.glassN.textContent = GS.glass;
  UI.bottleBtn.hidden = !GS.stash;
  UI.bottleN.textContent = '+' + GS.stash;
  UI.shopBtn.hidden = !furnitureLeft().length && !nextBottlePrice();
  if (shopOpen) renderShop();
  for (const b of UI.floors.children) {
    const v = b.dataset.view;
    b.hidden = v !== 'all' && +v > storeys;
    b.classList.toggle('sel', v === String(CAM.name));
  }
  for (const id in UI.faceBtns) UI.faceBtns[id].classList.toggle('known', present(id));
  let label = '', frac = 1, ready = true;
  if (!towerDone()) {
    const cost = nextFloorCost();
    label = `${GS.storeys + 1}階 ${Math.min(GS.glass, cost)}/${cost}`;
    frac = Math.min(1, GS.glass / cost); ready = GS.glass >= cost;
  } else if (!allPets() && !GS.sill) { label = `おやつ ${RULES.sillPrice}`; ready = GS.glass >= RULES.sillPrice; }
  UI.growBtn.hidden = !label;
  UI.growLabel.textContent = label;
  UI.growFill.style.width = frac * 100 + '%';
  UI.growBtn.classList.toggle('ready', ready);
  if (cardFor) refreshCardPrices();
}
function refreshCardPrices() {
  const c = UI.card, id = cardFor, busy = !!WORLD.react[id] && WORLD.react[id].anim !== 'happy';
  c.querySelectorAll('.good').forEach(b => {
    const key = b.dataset.good, afford = GS.glass >= GOODS[key].price;
    b.disabled = !afford || busy;
    b.querySelector('.gp').classList.toggle('no', !afford);
  });
}
function toInternal(e) {
  const r = display.getBoundingClientRect(), v = CAM.cur;
  return [(e.clientX - r.left) / r.width * v[2] + v[0], (e.clientY - r.top) / r.height * v[3] + v[1]];
}
/* whatever is nearest to the finger wins; fingers are wide, so the reach is generous */
function hitTest(ix, iy) {
  const reach = 14 * CAM.cur[2] / 360 + 5;
  let best = null, bd = reach;
  GS.beach.forEach((g, n) => {
    const s = SLOTS[g.slot];
    if (!s) return;
    const d = Math.hypot(s.x - ix, s.y - iy);
    if (d < bd) { bd = d; best = { kind: 'glass', n }; }
  });
  GS.presents.forEach((p, n) => {
    const s = SLOTS[p.slot];
    if (!s || FALLING.some(f => f.slot === p.slot)) return;
    const d = Math.hypot(s.x - ix, s.y - 3 - iy) - 3;
    if (d < bd) { bd = d; best = { kind: 'present', n }; }
  });
  const flying = balloonAt();
  if (flying) {
    const d = Math.hypot(flying[0] - ix, flying[1] - 22 - iy) - 18;   // it's tall, and moving: forgive a near miss
    if (d < bd) { bd = d; best = { kind: 'balloon' }; }
  }
  for (const id of ACTOR_IDS) {
    if (!present(id)) continue;
    const A = ACTOR[id], d = Math.hypot(A.sx - ix, A.sy - iy) - 3;
    if (d < bd) { bd = d; best = { kind: 'animal', id }; }
  }
  return best;
}
function onCanvasTap(e) {
  if (growing) return;
  if (menuOpen || shopOpen || helpOpen) { closeSheets(); return; }
  const [ix, iy] = toInternal(e), hit = hitTest(ix, iy);
  if (!hit) { closeCard(); return; }
  if (hit.kind === 'balloon') {
    if (catchBalloon()) { saveGame(); refreshUI(); }
  } else if (hit.kind === 'present') {
    const s = SLOTS[GS.presents[hit.n].slot], v = openPresent(hit.n);
    BURSTS.push({ x: s.x, y: s.y, count: Math.min(16, 6 + (v >> 2)), seed: GS.n + v, t0: WORLD.now });
    for (let i = 0; i < 5; i++) spark(s.x + (i - 2) * 5, s.y - 3, ['sea6', 'lef6', 'amb7'][i % 3], 12, .7);
    floatNumber(s.x, s.y - 8, '+' + v);
    saveGame(); refreshUI();
  } else if (hit.kind === 'glass') {
    const s = SLOTS[GS.beach[hit.n].slot], k = GS.beach[hit.n].kind, v = collectAt(hit.n);
    spark(s.x, s.y, ['sea6', 'lef6', 'amb7'][k]);
    floatNumber(s.x, s.y, '+' + v);
    saveGame(); refreshUI();
  } else {
    petAnimal(hit.id);
    lookAt(hit.id);
    openCard(hit.id);
    saveGame();
  }
}
function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* the store is blocked: the new game just won't persist */ }
  GS = newState();
  FLOAT = null; HILITE = null;
  FALLING.length = LOOSE.length = BURSTS.length = 0;
  for (let i = 0; i < 3; i++) spawnGlass();
  GS.lastSeen = nowMs();
  storeys = 1;
  WORLD.react = {}; WORLD.sparks.length = 0;
  pushWorld(); rebake();
  closeSheets(); setView('all');
  saveGame(); refreshUI();
}
/* an absence, whether a closed page or a long-hidden tab */
function comeBack() {
  const sec = (nowMs() - GS.lastSeen) / 1000;
  const r = settleAbsence(sec);
  pushWorld();
  if (r.rebake) rebake();
  if (r.pet) toast(`${ANIMALS[r.pet].name}がやってきました`, 5);
  saveGame(); refreshUI();
}
let saveEvery = 5;
function gameFrame(dt) {
  if (!gameOn) return;
  advance(dt);
  stepCamera(dt);
  if (toastTimer > 0 && (toastTimer -= dt) <= 0) UI.toast.classList.remove('on');
  if ((saveEvery -= dt) <= 0) { saveEvery = 5; saveGame(); refreshUI(); }
}
function gameBoot() {
  gameOn = !(CFG.full || CFG.floors || CFG.sheet || CFG.loop);
  OWNED.all = !gameOn;
  if (!gameOn) {
    storeys = CFG.full ? 3 : CFG.floors || 1;
    if (CFG.full) { WORLD.pets.dragon = WORLD.pets.sheep = WORLD.pets.penguin = true; for (const k in WORLD.aff) WORLD.aff[k] = 10; }
    return;
  }
  const saved = readSave();
  GS = saved || newState();
  storeys = GS.storeys;
  pushWorld();
}
/* runs once the first bake has told us where the sand is */
function gameStart() {
  if (!gameOn) return;
  initSlots();
  const fresh = !GS.lastSeen;
  if (fresh) {
    for (let i = 0; i < 3; i++) spawnGlass();
    GS.lastSeen = nowMs();
  }
  pushWorld();
  buildUI();
  if (fresh) saveGame();
  else comeBack();
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = nowMs(); saveGame(); }
    else if (hiddenAt && nowMs() - hiddenAt >= RULES.resumeAfter * 1000) comeBack();
  });
  window.addEventListener('pagehide', saveGame);
}
const GAME = {
  state: () => JSON.parse(JSON.stringify(GS)),
  rules: RULES, goods: GOODS, furniture: FURNITURE,
  furnish: key => { const ok = furnish(key); if (UI.ui) refreshUI(); return ok; },
  left: furnitureLeft,
  painted: name => { const id = NAMED[name].id; let n = 0; for (let i = 0; i < N; i++) if (gId[i] === id) n++; return n; },
  advance: sec => { advance(sec); pushWorld(); },
  collectAll: () => { let v = 0; while (GS.beach.length) v += collectAt(0); pushWorld(); if (UI.ui) refreshUI(); return v; },
  give: (id, good) => { GS.glass += GOODS[good].price; delete WORLD.react[id]; return buyFor(id, good); },
  buy: (id, good) => { delete WORLD.react[id]; const ok = buyFor(id, good); delete WORLD.react[id]; if (UI.ui) refreshUI(); return ok; },
  grow: () => { const ok = growNow(); pushWorld(); if (UI.ui) refreshUI(); return ok; },
  sill: placeSill,
  bottle: () => { const ok = upgradeBottle(); if (UI.ui) refreshUI(); return ok; },
  bottleCap,
  fillBottle: n => { GS.stash = n; },
  balloon: () => { const b = balloonAt(); return b && [b[0], b[1] - 22]; },
  launch: launchBalloon,
  catchBalloon,
  openPresents: () => { let v = 0; while (GS.presents.length) v += openPresent(0); if (UI.ui) refreshUI(); return v; },
  art: key => { const a = furnitureArt(key); return [a.w, a.h, a.n]; },
  highlight: () => HILITE && { key: HILITE.key, px: HILITE.list.length, ring: HILITE.ring ? HILITE.ring.length : -1 },
  comeBack: sec => { GS.lastSeen = nowMs() - sec * 1000; comeBack(); return JSON.parse(JSON.stringify(GS)); },
  save: saveGame, read: readSave, reset: () => resetGame(),
  slots: () => SLOTS.map(s => [s.x, s.y]),
  hit: hitTest, present, view: () => CAM.name, react: () => Object.keys(WORLD.react),
  actorAt: id => [ACTOR[id].sx, ACTOR[id].sy],
  camera: () => CAM.cur.slice(),
  storeys: () => storeys,
};

/* ═══════════════════════════════════════════════════════════════════════
   Render loop, capture hooks, debug panel.
   ═══════════════════════════════════════════════════════════════════════ */
const display = document.getElementById('view');
display.width = DW; display.height = DH;
const dctx = display.getContext('2d', { alpha: false });
dctx.imageSmoothingEnabled = false;
const frame = makeCanvas(W, H), fctx = frame.getContext('2d', { alpha: false });
fctx.imageSmoothingEnabled = false;

const dynCanvas = makeCanvas(W, H), dynCtx = dynCanvas.getContext('2d');
const dynImg = dynCtx.createImageData(W, H), dyn = new Uint32Array(dynImg.data.buffer);

function drawClouds(t) {
  const on = FX.clouds;
  fctx.drawImage(LAYER.sky, 0, 0);
  if (!on) return;
  LAYER.clouds.forEach((c, n) => {
    const off = n === 0 ? Math.floor(cyc(t, 1) * 320) : Math.floor(cyc(t, 2) * 320);
    fctx.drawImage(c, -off, 0); fctx.drawImage(c, 320 - off, 0); fctx.drawImage(c, 640 - off, 0);
  });
}

/* Time is an integer tick, reduced to one block before anything reads it. Every
   effect is then a function of the same exact number at t and t + 120, so float
   rounding can never make a loop boundary differ. */
const TICKS = 240;
function renderFrame(time) {
  const tick = Math.round(time * TICKS), k = Math.floor(tick / (LOOP * TICKS));
  const t = (tick - k * LOOP * TICKS) / TICKS;
  WORLD.now = time;
  const st = sampleWorld(t, k);
  drawClouds(t);
  fctx.drawImage(LAYER.base, 0, 0);
  if (LAYER.fire.length) { const f = LAYER.fire[fireLevel(t)]; fctx.drawImage(f.cv, f.x, f.y); }
  dyn.fill(0);
  drawDynamic(t, st);
  dynCtx.putImageData(dynImg, 0, 0);
  fctx.drawImage(dynCanvas, 0, 0);
  drawHighlight(t);
  const z = CFG.zoom;
  if (z.length === 4 && z.every(Number.isFinite)) dctx.drawImage(frame, z[0], z[1], z[2], z[3], 0, 0, DW, DH);
  else dctx.drawImage(frame, 0, 0, DW, DH);
}

/* ── boot ─────────────────────────────────────────────────────────────── */
const T0 = performance.now();
gameBoot();
buildSky();
paintAll();
computeLight();
bakeLayers();
initDynamic();
gameStart();
const stats = { bake: performance.now() - T0, frameMs: 0, fps: 0, frames: 0 };

function frameHash(t) {
  renderFrame(t);
  const d = fctx.getImageData(0, 0, W, H).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 4) { h ^= d[i] | d[i + 1] << 8 | d[i + 2] << 16; h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* t and t + 120 must be pixel-identical in loop mode, and the frame at every
   block boundary must match in free-running mode. */
function loopCheck() {
  const out = [];
  const prevLoop = CFG.loop;
  CFG.loop = true; blockCache.clear();
  for (const dt of [0, 1 / 60, 13.37, 47.25, 59.5, 88.8, 119.5]) {
    const a = frameHash(dt), b = frameHash(dt + LOOP);
    out.push({ t: dt, a, b, same: a === b });
  }
  CFG.loop = prevLoop; blockCache.clear();
  return out;
}
function boundaryCheck(blocks = 24) {
  const prevLoop = CFG.loop;
  CFG.loop = false; blockCache.clear();
  const ref = frameHash(0), bad = [];
  for (let k = 1; k <= blocks; k++) if (frameHash(k * LOOP) !== ref) bad.push(k);
  CFG.loop = prevLoop; blockCache.clear();
  return { blocks, ref, bad };
}
let clock = CFG.freeze !== null ? CFG.freeze : 0, last = performance.now(), running = CFG.freeze === null;
const dollhouse = {
  renderAt: t => { running = false; clock = t; renderFrame(t); },
  frameHash, loopCheck, boundaryCheck, stats, CFG, FX, FX_INFO, SCRIPT_NAMES,
  play: () => { running = true; last = performance.now(); },
  toggle: () => { running = !running; last = performance.now(); },
  seek: t => { clock = t; if (!running) renderFrame(t); },
  clock: () => clock,
  pose: () => Object.fromEntries(Object.entries(ACTOR).map(([k, a]) => [k, [Math.round(a.x), Math.round(a.y), Math.round(a.z), a.anim]])),
  game: GAME,
  scripts: (seed = 1) => SCRIPT_NAMES.map(n => { const b = compileBlock(n, seed); return [n, ...ACTOR_IDS.map(id => b[id].at(-1).t0)]; }),
  story: storyAt,
  /* every script at a given height and with or without the furniture, for checking lengths and endings */
  scriptsAt: (n, furnished, seed = 1, pets = true) => {
    const s = storeys, a = OWNED.all, p = { ...WORLD.pets };
    storeys = n; OWNED.all = furnished;
    for (const k in WORLD.pets) WORLD.pets[k] = pets;
    const out = SCRIPT_NAMES.map(name => { const b = compileBlock(name, seed); return [name, ...ACTOR_IDS.map(id => b[id].at(-1).t0)]; });
    storeys = s; OWNED.all = a; Object.assign(WORLD.pets, p);
    return out;
  },
  /* everyone's place at one moment of a story, without drawing it */
  poseIn: (name, seed, t) => {
    const b = compileBlock(name, seed), out = {};
    for (const id of ACTOR_IDS) { const A = ACTOR[id]; sampleActor(A, b[id], t); out[id] = { x: A.x, y: A.y, z: A.z, anim: A.anim, sx: 180 + A.x - A.y, out: isOutdoors(A), roof: A.z >= TOP_Z(storeys) }; }
    return out;
  },
  timeline: k => { const b = blockFor(k); return ACTOR_IDS.map(w => w + ': ' + b[w].map(s => `${s.t0.toFixed(1)} ${s.anim}`).join(', ')); },
};
window.dollhouse = dollhouse;

if (CFG.sheet) drawSheet();
else if (CFG.freeze !== null) renderFrame(CFG.freeze);
const stage = document.getElementById('stage');
function layout() { stage.style.setProperty('--u', stage.clientWidth / W + 'px'); }
layout();
window.addEventListener('resize', layout);
if (CFG.debug) togglePanel(true);

window.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'd' || e.key === 'D') togglePanel();
  else if (e.key === ' ') { e.preventDefault(); dollhouse.toggle(); }
  else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen && stage.requestFullscreen(); }
});

function tick(now) {
  requestAnimationFrame(tick);
  if (CFG.sheet || !running) return;
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  clock += dt * CFG.speed;
  gameFrame(dt);
  const t0 = performance.now();
  renderFrame(clock);
  const ms = performance.now() - t0;
  stats.frameMs += (ms - stats.frameMs) * .05;
  stats.fps += ((dt > 0 ? 1 / dt : 60) - stats.fps) * .05;
  stats.frames++;
  updatePanel();
}
requestAnimationFrame(tick);

})();
</script>
