<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Island Tower</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f5c9c; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  /* on a tall phone the bars above and below carry on the sky and the sea */
  @media (max-aspect-ratio: 9/16) { html, body { background: linear-gradient(#3f8ee0 0 50%, #1567a8 50% 100%); } }
  #stage { position: relative; width: min(100vw, calc(100vh * 9 / 16)); width: min(100vw, calc(100dvh * 9 / 16)); aspect-ratio: 9 / 16; --u: 1px; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
  .px { display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
  #ui { position: absolute; inset: 0; pointer-events: none; color: #5a4632; font: 500 calc(var(--u) * 12)/1.35 "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic UI", "Meiryo", sans-serif; }
  #ui[hidden] { display: none; }
  #ui button { font: inherit; color: inherit; border: 0; cursor: pointer; pointer-events: auto; }
  #ui button[hidden] { display: none; }

  #topbar { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: calc(var(--u) * 8); display: flex; gap: calc(var(--u) * 6); align-items: center; }
  .pill { display: flex; align-items: center; gap: calc(var(--u) * 5); height: calc(var(--u) * 30); padding: 0 calc(var(--u) * 10); background: #fff8e7; border-radius: calc(var(--u) * 15); box-shadow: 0 calc(var(--u) * 2) 0 #d9c49a; font-weight: 700; font-size: calc(var(--u) * 14); }
  #shopBtn { margin-left: auto; font-size: calc(var(--u) * 12); }
  #helpBtn, #menuBtn { width: calc(var(--u) * 30); padding: 0; justify-content: center; }

  #catArtBtn { position: absolute; left: calc(var(--u) * 8); top: calc(var(--u) * 46); font-size: calc(var(--u) * 12); }
  #floors { position: absolute; right: calc(var(--u) * 8); top: calc(var(--u) * 46); display: flex; flex-direction: column; gap: calc(var(--u) * 5); }
  #floors button { width: calc(var(--u) * 40); height: calc(var(--u) * 30); padding: 0; background: #fff8e7cc; border-radius: calc(var(--u) * 9); font-size: calc(var(--u) * 11); }
  #floors button.sel { background: #3a9fd0; color: #fff; }

  #dock { position: absolute; left: calc(var(--u) * 6); right: calc(var(--u) * 6); bottom: calc(var(--u) * 8); display: flex; gap: calc(var(--u) * 4); align-items: stretch; }
  #growBtn { position: relative; flex: 1 1 auto; min-width: 0; height: calc(var(--u) * 46); padding: 0; border-radius: calc(var(--u) * 12); background: #fff8e7; box-shadow: 0 calc(var(--u) * 3) 0 #d9c49a; overflow: hidden; }
  #growFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #bfe9f2; transition: width .3s; }
  #growBtn.ready #growFill { background: #ffd978; }
  #growLabel { position: relative; display: block; font-weight: 700; font-size: calc(var(--u) * 12); }
  #faces { display: grid; grid-template-columns: repeat(6, calc(var(--u) * 37)); gap: calc(var(--u) * 2); }
  .face { position: relative; height: calc(var(--u) * 46); padding: 0; display: flex; align-items: center; justify-content: center; background: #fff8e7; border-radius: calc(var(--u) * 10); box-shadow: 0 calc(var(--u) * 3) 0 #d9c49a; overflow: hidden; }
  .face .px { display: none; }
  .face .qm { font-weight: 700; font-size: calc(var(--u) * 15); color: #c9b48a; }
  .face.known .px { display: block; }
  .face.known .qm { display: none; }
  .face .hg { display: none; position: absolute; right: calc(var(--u) * 1); top: calc(var(--u) * 1); }
  .face.hungry .hg { display: block; }
  .face.hungry .hg .px { display: block; }

  #toast { position: absolute; left: calc(var(--u) * 24); right: calc(var(--u) * 24); top: calc(var(--u) * 46); padding: calc(var(--u) * 8) calc(var(--u) * 12); margin-right: calc(var(--u) * 26); background: #fff8e7f2; border-radius: calc(var(--u) * 12); box-shadow: 0 calc(var(--u) * 2) 0 #d9c49a; text-align: center; opacity: 0; transform: translateY(calc(var(--u) * -6)); transition: opacity .25s, transform .25s; }
  #toast.on { opacity: 1; transform: none; }

  .sheet { position: absolute; left: calc(var(--u) * 6); right: calc(var(--u) * 6); bottom: calc(var(--u) * 62); max-height: calc(var(--u) * 520); overflow-y: auto; padding: calc(var(--u) * 12); background: #fff8e7; border-radius: calc(var(--u) * 16); box-shadow: 0 calc(var(--u) * 3) 0 #d9c49a; pointer-events: auto; display: none; }
  .sheet.on { display: block; }
  .sheet.top { top: calc(var(--u) * 44); bottom: auto; }
  .sheet h3 { margin: 0 0 calc(var(--u) * 6); font-size: calc(var(--u) * 15); }
  .sheet .goods + h3 { margin-top: calc(var(--u) * 12); }
  .sheet ul { margin: 0; padding: 0 0 0 calc(var(--u) * 16); }
  .sheet li { margin: calc(var(--u) * 6) 0; font-size: calc(var(--u) * 12); }
  .sheet .x { position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 6); width: calc(var(--u) * 32); height: calc(var(--u) * 32); padding: 0; background: transparent; font-size: calc(var(--u) * 18); }
  .head { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .head b { font-size: calc(var(--u) * 15); }
  .head .ic { display: flex; width: calc(var(--u) * 44); height: calc(var(--u) * 44); align-items: center; justify-content: center; background: #e2f6fb; border-radius: calc(var(--u) * 10); overflow: hidden; }
  .head .ic .px { max-height: 100%; }
  .hearts { font-size: calc(var(--u) * 13); letter-spacing: .05em; }
  .hearts i { font-style: normal; color: #e6d8bd; }
  .hearts i.full { color: #ec7f9d; }
  .hearts i.half { color: #f5bccb; }
  .hunger { width: calc(var(--u) * 74); height: calc(var(--u) * 6); margin-top: calc(var(--u) * 3); background: #e6d8bd; border-radius: calc(var(--u) * 3); overflow: hidden; }
  .hunger i { display: block; height: 100%; background: #8fce74; }
  .hunger.low i { background: #efaa55; }
  .goods { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 6); }
  .head + .goods { margin-top: calc(var(--u) * 8); }
  .good { display: flex; align-items: center; gap: calc(var(--u) * 6); min-height: calc(var(--u) * 46); padding: calc(var(--u) * 4) calc(var(--u) * 7); text-align: left; background: #ffefc8; border-radius: calc(var(--u) * 10); }
  .good:disabled { opacity: .55; cursor: default; }
  .good .gi { flex: none; display: flex; width: calc(var(--u) * 22); justify-content: center; }
  .good .gt { flex: 1 1 auto; min-width: 0; font-size: calc(var(--u) * 11); line-height: 1.25; font-weight: 700; }
  .good .gp { flex: none; font-weight: 700; font-size: calc(var(--u) * 13); color: #2b7fae; }
  .good .gp.no { color: #b98a8a; }
  .good.pic { min-height: calc(var(--u) * 58); padding: calc(var(--u) * 5) calc(var(--u) * 6); }
  .good.pic .gi { width: calc(var(--u) * 48); height: calc(var(--u) * 48); align-items: center; background: #fff8e7; border-radius: calc(var(--u) * 8); }
  .good .gc { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
  .wide { display: block; width: 100%; min-height: calc(var(--u) * 42); margin-top: calc(var(--u) * 6); background: #e2f6fb; border-radius: calc(var(--u) * 10); font-weight: 700; }
  .wide.danger { background: #fbe3df; color: #9c4a3f; }
  #reloadBox, #consent { z-index: 2; }
  #reloadBox p, #consent p { margin: 0 0 calc(var(--u) * 4); }

  .float { position: absolute; transform: translate(-50%, -100%); font-weight: 700; font-size: calc(var(--u) * 15); color: #fff; text-shadow: 0 0 calc(var(--u) * 3) #1c6fa8, 0 calc(var(--u) * 1) 0 #1c6fa8; animation: rise .9s ease-out forwards; pointer-events: none; }
  @keyframes rise { to { margin-top: calc(var(--u) * -26); opacity: 0; } }

  #puff { position: absolute; inset: 0; background: #fffef8; opacity: 0; transition: opacity .55s; pointer-events: none; }
  #puff.on { opacity: 1; }

  #unhide { display: none; position: absolute; inset: 0; background: transparent; }
  #ui.hide > *:not(#unhide):not(#puff):not(#reloadBox) { display: none; }
  #ui.hide #unhide { display: block; }

  #panel { position: fixed; top: 8px; right: 8px; width: 270px; max-height: calc(100vh - 16px); overflow: auto; background: #17131fee; color: #f2d7b8; font: 11px/1.45 ui-monospace, Consolas, monospace; padding: 10px; border: 2px solid #4a2823; display: none; box-sizing: border-box; z-index: 5; }
  #panel h1 { font-size: 12px; margin: 0 0 6px; color: #f2bf5e; }
  #panel h2 { font-size: 11px; margin: 10px 0 4px; color: #de8d54; font-weight: 700; }
  #panel label { display: block; cursor: pointer; }
  #panel .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #panel input[type=range] { flex: 1; min-width: 0; }
  #panel input[type=number] { width: 80px; background: #0e0c18; color: inherit; border: 1px solid #4a2823; }
  #panel button { background: #351b1e; color: inherit; border: 1px solid #7a4731; font: inherit; padding: 2px 6px; cursor: pointer; margin: 2px 2px 2px 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="ui" hidden>
    <div id="topbar">
      <div class="pill"><span id="glassIcon"></span><span id="glassN">0</span></div>
      <button class="pill" id="shopBtn">おみせ</button>
      <button class="pill" id="helpBtn" aria-label="遊び方">？</button>
      <button class="pill" id="menuBtn" aria-label="メニュー">≡</button>
    </div>
    <div id="toast"></div>
    <div id="floors"></div>
    <button class="pill" id="catArtBtn" hidden></button>
    <div id="dock">
      <button id="growBtn"><span id="growFill"></span><span id="growLabel"></span></button>
      <div id="faces"></div>
    </div>
    <div id="card" class="sheet"></div>
    <div id="shop" class="sheet"></div>
    <div id="help" class="sheet"></div>
    <div id="menu" class="sheet"></div>
    <div id="consent" class="sheet"></div>
    <div id="reloadBox" class="sheet"><p>絵がうまく表示できませんでした。</p><button id="reloadBtn" class="wide">再読み込み</button></div>
    <div id="puff"></div>
    <button id="unhide" aria-label="文字を表示する"></button>
  </div>
</div>
<div id="panel"></div>
<script>
(function () {
/*__SOURCES__*/
})();
</script>
</body>
</html>
